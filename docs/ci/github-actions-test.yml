# GitHub Actions workflow, kept here until the push token has the "workflow" scope.
# To enable: move this file to .github/workflows/test.yml.
name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The PKHeX oracle tests skip themselves without the .NET SDK; the fuzzers are run by hand (tools/fuzz).
      - run: npm test
